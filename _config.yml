title: Content Safety Study Group
description: Research homepage — reasoning-aware, severity-aware, culture-aware content moderation.
theme: jekyll-theme-cayman

# URLs 友好
permalink: pretty

# 不被 Jekyll 处理的目录
exclude:
  - EMNLP/
  - README.md
  - HOMEPAGE.md
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock

# 默认 layout
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
